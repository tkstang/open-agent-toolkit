name: Release Dry Run

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-dry-run:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      # Dry-run workflow contract:
      # - install dependencies
      # - build the publishable workspace packages
      # - run pnpm release:validate to pack and inspect all five packages without npm auth
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Release flows stay on Node 24 because publishing and dry-run verification
      # are coupled to the npm runtime we use for trusted publishing.
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
          pnpm-version: '10.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Show runtime versions
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release validate
        run: pnpm release:validate
